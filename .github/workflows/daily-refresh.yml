name: Daily UK police documentary refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: write

concurrency:
  group: uk-police-catalogue-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out catalogue
        uses: actions/checkout@v7
        with:
          # Branch tip at job start, not the trigger commit: a run queued behind
          # the other refresh would otherwise start from an outdated commit.
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check pagination and watchdog rules
        run: python -m unittest discover -s tests
      - name: Discover new UK programmes and rebuild both catalogues
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: python scripts/update_catalogs.py
      - name: Validate output and preserve the approved programmes
        run: python scripts/validate_catalogs.py
      - name: Commit any catalogue or audit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/
          if ! git diff --cached --quiet; then
            git commit -m "Daily UK police catalogue refresh"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          else
            echo "No catalogue changes."
          fi
