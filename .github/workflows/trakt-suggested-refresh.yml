name: Refresh Trakt Suggested catalogues

on:
  workflow_dispatch:
  schedule:
    # Hourly at :17. The watchdog runs at :52 and counts a slot once its
    # 25-minute grace has passed, so it re-runs any hour GitHub skips.
    - cron: '17 * * * *'

permissions:
  contents: write

# Shared with the existing police updater: both commit to the same branch.
concurrency:
  group: uk-police-catalogue-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out catalogues
        uses: actions/checkout@v7
        with:
          # Branch tip at job start, not the trigger commit: a run queued behind
          # the police refresh would otherwise start from an outdated commit.
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check history, returning-season and publication contracts
        run: |
          python -m unittest trakt_suggested_engine.test_engine trakt_suggested_runtime.test_runtime
      # Rotten Tomatoes answers from MDBList are kept for 7 days between runs,
      # so the hourly refresh stays inside MDBList's free 1,000 lookups a day.
      - name: Restore the Rotten Tomatoes answers kept between runs
        uses: actions/cache/restore@v6
        with:
          path: .mdblist-cache
          key: mdblist-${{ github.run_id }}
          restore-keys: mdblist-
      # TMDB list answers (recommendations, similar, discover) are kept for 24
      # hours: TMDB serves different versions from different CloudFront
      # locations, so fresh lists made titles come and go between runs.
      # Details are fetched fresh every run.
      - name: Restore the TMDB list answers kept between runs
        uses: actions/cache/restore@v6
        with:
          path: .tmdb-list-cache
          key: tmdb-lists-${{ github.run_id }}
          restore-keys: tmdb-lists-
      - name: Generate both rows from fresh Trakt history
        env:
          TRAKT_USERNAME: ${{ secrets.TRAKT_USERNAME || vars.TRAKT_USERNAME }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: |
          mkdir -p .mdblist-cache .tmdb-list-cache
          python -m trakt_suggested_runtime --cache-dir "$RUNNER_TEMP/trakt-suggested-tmdb" --timeout-minutes 25 --mdblist-cache .mdblist-cache/answers.json --tmdb-list-cache .tmdb-list-cache
      - name: Keep the Rotten Tomatoes answers for the next run
        if: always() && hashFiles('.mdblist-cache/answers.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .mdblist-cache
          key: mdblist-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep the TMDB list answers for the next run
        if: always() && hashFiles('.tmdb-list-cache/*.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .tmdb-list-cache
          key: tmdb-lists-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate every published route
        run: python -m trakt_suggested_runtime --validate-only
      - name: Commit only final suggested catalogue metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/suggested/
          if ! git diff --cached --quiet -- docs/suggested/; then
            git commit -m "Refresh Trakt Suggested catalogues"
            # Jenny's refresh pushes to this branch from its own group.
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
              sleep $((attempt * 5))
            done
            exit 1
          else
            echo "No catalogue changes."
          fi
